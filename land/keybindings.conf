###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
$mainMod = SUPER # Sets "Windows" key as main modifier

# Mouse bindings
# See https://wiki.hypr.land/Configuring/Binds/#mouse-binds
bindm = $mainMod, mouse:272, movewindow # ALT + LMB: Move a window by dragging

# Keybindings
bind = $mainMod, return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, Q, killactive,

# Next window created will be split to the left
bind = $mainMod SHIFT, B, layoutmsg, preselect l
# Next window created will be split to the right
bind = $mainMod, B, layoutmsg, preselect r
# Next window created will be split to the top (up)
bind = $mainMod SHIFT, V, layoutmsg, preselect u
# Next window created will be split to the bottom (down)
bind = $mainMod, V, layoutmsg, preselect d

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window with mainMod + shift + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Move the current workspace to the next or previous monitor
bind = CTRL ALT, left, movecurrentworkspacetomonitor, -1
bind = CTRL ALT, right, movecurrentworkspacetomonitor, +1

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Toggle submap
bind = $mainMod, T, submap, toggle_submap

submap = toggle_submap
    bind = , C, exec, zsh -c 'copyq toggle; hyprctl dispatch submap reset'
    bind = , W, exec, zsh -c 'pkill -SIGUSR1 waybar & ; hyprctl dispatch submap reset'
    bind = , F, exec, zsh -c 'hyprctl dispatch togglefloating; hyprctl dispatch submap reset'

    # Back to default submap
    bind = , Return, submap, reset
    bind = , Escape, submap, reset
submap = reset
